name: 예약 실행 유지

# 공개 저장소에 60일 동안 커밋이 없으면 GitHub가 예약 실행(schedule)을 멈춥니다.
# 매일 갱신 커밋이 생기므로 보통은 필요 없지만, 공고가 없어 커밋이 끊길 때를 대비해 매달 한 번 빈 커밋을 남깁니다.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "예약 실행 유지 $(date +%F)"
          git push
