name: 장학공지 매일 갱신 (무료)

on:
  schedule:
      - cron: "7 21,3,9 * * *"   # 매일 06:07 · 12:07 · 18:07 KST (하루 3번)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["src/**", "data/overrides.json", "index.html"]

permissions:
  contents: write   # 갱신된 데이터를 저장소에 커밋
  pages: write      # GitHub Pages 배포
  id-token: write
  models: read      # GitHub Models (무료 한도) 사용

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: 장학공지 수집·분석
        # 학교 사이트에 접속하지 못하는 날에도 사이트 배포는 이어서 진행 (기존 데이터 유지)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o' }}
          MAX_AI_CALLS: ${{ vars.MAX_AI_CALLS || '40' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '75' }}
        run: npm run crawl

      - name: 데이터 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/notices.json data/cache.json
          git diff --cached --quiet || git commit -m "장학공지 갱신 $(TZ=Asia/Seoul date +%F)"
          git push

      - name: 사이트 빌드
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
